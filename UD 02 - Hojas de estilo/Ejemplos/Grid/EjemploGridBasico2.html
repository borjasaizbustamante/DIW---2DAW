<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Grid Básico</title>
    <style>
        .grid-container {
            display: grid;
            /* Equivalente a: 1fr 1fr 1fr */
            grid-template-columns: repeat(3, 1fr); 
            
            /* Rejilla auto-adaptable: crea columnas de mínimo 200px que crecen hasta 1fr */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
    </style>

    </head>
<body>

    <div class="grid-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

</body>
</html>
