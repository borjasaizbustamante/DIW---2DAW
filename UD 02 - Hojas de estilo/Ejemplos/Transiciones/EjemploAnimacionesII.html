<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación Caja en Movimiento</title>
  <style>
    /* Estilos del contenedor */
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      overflow-x: hidden;
    }

    /* Panel de controles */
    .controles {
      margin-bottom: 30px;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    #btnIniciar {
      background-color: #2ecc71;
      color: white;
    }

    #btnDetener {
      background-color: #e74c3c;
      color: white;
    }

    /* Regla @keyframes */
    @keyframes moverYDifuminar {
      0% {
        transform: translateX(0);
        background-color: #3498db;
        color: #ffffff;
      }
      50% {
        transform: translateX(calc(100vw - 180px));
        background-color: #e74c3c;
        color: #f1c40f;
      }
      100% {
        transform: translateX(0);
        background-color: #3498db;
        color: #ffffff;
      }
    }

    /* Estilos de la caja */
    .caja {
      width: 140px;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

      /* Animación activa por defecto */
      animation: moverYDifuminar 4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <!-- Panel con los dos botones de control -->
  <div class="controles">
    <button id="btnIniciar">Iniciar / Reanudar</button>
    <button id="btnDetener">Pausar / Detener</button>
  </div>

  <!-- Elemento animado -->
  <div class="caja" id="miCaja">
    Caja Animada
  </div>

  <script>
    // 1. Seleccionamos los elementos del DOM
    const caja = document.getElementById('miCaja');
    const btnIniciar = document.getElementById('btnIniciar');
    const btnDetener = document.getElementById('btnDetener');

    // 2. Evento para reanudar la animación
    btnIniciar.addEventListener('click', () => {
      caja.style.animationPlayState = 'running';
    });

    // 3. Evento para pausar la animación
    btnDetener.addEventListener('click', () => {
      caja.style.animationPlayState = 'paused';
    });
  </script>

</body>
</html>
