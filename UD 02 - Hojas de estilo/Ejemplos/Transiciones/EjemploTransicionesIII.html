<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transición con Cubic Bezier Personalizado</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      overflow-x: hidden;
    }

    /* ESTADO INICIAL */
    .caja {
      width: 140px;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;

      /* Estado base */
      transform: translateX(0) scale(1);
      transform-origin: left center;
      background-color: #3498db;
      color: #ffffff;

      /* 
         TRANSICIÓN CON CUBIC-BEZIER:
         Sintaxis: [propiedad] [duración] [cubic-bezier(x1, y1, x2, y2)]
         Curva utilizada: cubic-bezier(0.68, -0.55, 0.265, 1.55)
      */
      transition: transform 2s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                  background-color 2s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                  color 2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* ESTADO FINAL (:hover) */
    .caja:hover {
      transform: translateX(calc(100vw - 320px)) scale(1.8);
      background-color: #e74c3c;
      color: #f1c40f;
    }
  </style>
</head>
<body>

  <p>Pasa el ratón sobre la caja para ver el efecto de la curva <strong>cubic-bezier con rebote</strong>:</p>

  <div class="caja">
    Cubic Bezier
  </div>

</body>
</html>
